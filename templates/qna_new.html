<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ t.ask_question }} - DevNetwork Q&A</title>

  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg-page: #000000;
      --bg-surface: #0B0E14;
      --bg-card: #11141A;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.18);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --accent-emerald: #10B981;
      --accent-discord: #5865F2;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .bg-ambient-top {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 1200px;
      height: 400px;
      background: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.08), rgba(88, 101, 242, 0.04), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      background: rgba(0, 0, 0, 0.8);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0.85rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: var(--text-main);
    }
    .brand-logo { width: 28px; height: 28px; border-radius: 6px; }
    .brand-title { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; }
    .brand-pill {
      font-size: 0.7rem; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 9999px;
      background: rgba(16, 185, 129, 0.12); color: var(--accent-emerald); border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .nav-actions { display: flex; align-items: center; gap: 0.75rem; }
    .feed-tab {
      display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.45rem 0.85rem;
      border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600; color: var(--text-muted);
      text-decoration: none; transition: all 0.15s ease;
    }
    .feed-tab:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.04); }
    .feed-tab.active { color: var(--text-main); background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-subtle); }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1.1rem; border-radius: var(--radius-sm);
      font-weight: 600; font-size: 0.875rem; text-decoration: none; cursor: pointer; border: none; font-family: inherit; transition: all 0.2s ease;
    }
    .btn-primary { background: #FFFFFF; color: #000000; }
    .btn-primary:hover { background: #E2E8F0; transform: translateY(-1px); }
    .btn-outline { background: transparent; border: 1px solid var(--border-subtle); color: var(--text-main); }
    .btn-outline:hover { border-color: var(--border-strong); background: rgba(255, 255, 255, 0.05); }
    footer { border-top: 1px solid var(--border-subtle); padding: 2.5rem 1.5rem; text-align: center; color: var(--text-dim); font-size: 0.85rem; margin-top: auto; }

    .write-container {
      max-width: 820px;
      margin: 2.5rem auto 5rem;
      padding: 0 1.5rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }
    .form-input, .form-textarea, .form-select {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      padding: 0.75rem 1rem;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease;
      box-sizing: border-box;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--border-strong);
    }
    .form-textarea {
      min-height: 240px;
      resize: vertical;
      line-height: 1.6;
    }
    .notice-card {
      background: rgba(88, 101, 242, 0.08);
      border: 1px solid rgba(88, 101, 242, 0.25);
      border-radius: var(--radius-sm);
      padding: 1rem 1.25rem;
      margin-bottom: 2rem;
      font-size: 0.85rem;
      color: #7983F5;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="bg-ambient-top"></div>

  <!-- Header -->
  <header>
    <a href="/" class="brand">
      <img src="/static/logo.png" alt="DN" class="brand-logo">
      <span class="brand-title">DevNetwork</span>
      <span class="brand-pill">Q&A</span>
    </a>

    <nav style="display: flex; align-items: center; gap: 0.5rem; margin-left: 1rem;">
      <a href="/" class="feed-tab"><span>{{ t.nav_articles }}</span></a>
      <a href="/qna" class="feed-tab active"><span>{{ t.nav_qna }}</span></a>
    </nav>

    <div class="nav-actions">
      {% if user %}
        <div style="display: flex; align-items: center; gap: 0.65rem;">
          <img src="{{ user.avatar_url }}" alt="avatar" style="width: 32px; height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
          <span style="font-weight: 600; font-size: 0.85rem;">{{ user.username }}</span>
        </div>
      {% endif %}
    </div>
  </header>

  <main class="write-container">
    <div style="margin-bottom: 1.75rem;">
      <h1 style="font-size: 1.85rem; font-weight: 800; margin-bottom: 0.5rem;">{{ t.ask_question }}</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem;">{{ t.qna_new_desc }}</p>
    </div>

    <div class="notice-card">
      <strong>{{ t.qna_new_notice_title }}</strong> {{ t.qna_new_notice_desc }}
    </div>

    <form action="/api/qna/create" method="POST">
      <div class="form-group">
        <label class="form-label">{{ t.target_forum_label }}</label>
        <select name="post_lang" class="form-select">
          <option value="ko" {% if lang == 'ko' %}selected{% endif %}>{{ t.target_forum_ko }}</option>
          <option value="en" {% if lang == 'en' %}selected{% endif %}>{{ t.target_forum_en }}</option>
          <option value="ja" {% if lang == 'ja' %}selected{% endif %}>{{ t.target_forum_ja }}</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">{{ t.input_title }} *</label>
        <input type="text" name="title" class="form-input" placeholder="{{ t.qna_input_title_placeholder }}" required>
      </div>

      <div class="form-group">
        <label class="form-label">{{ t.input_image_url }}</label>
        <input type="url" name="image_url" class="form-input" placeholder="https://.../screenshot.png">
      </div>

      <div class="form-group">
        <label class="form-label">{{ t.input_content }} *</label>
        <textarea name="content" class="form-textarea" placeholder="{{ t.qna_input_content_placeholder }}" required></textarea>
      </div>

      <div style="display: flex; gap: 1rem; align-items: center; margin-top: 2rem;">
        <button type="submit" class="btn btn-primary" style="padding: 0.65rem 1.5rem; font-size: 0.95rem;">
          {{ t.qna_submit_btn }}
        </button>
        <a href="/qna" class="btn btn-outline" style="padding: 0.65rem 1.25rem;">{{ t.cancel }}</a>
      </div>
    </form>
  </main>

  <footer>
    <p>{{ t.footer_text }}</p>
  </footer>
</body>
</html>
