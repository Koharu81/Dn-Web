<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | DevNetwork</title>
  <link rel="icon" type="image/png" href="/static/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0B0E14;
      --bg-card: rgba(18, 24, 38, 0.7);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.18);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --accent-emerald: #10B981;
      --accent-blue: #3B82F6;
      --radius-md: 14px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-base);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      position: relative;
      overflow-x: hidden;
    }
    .bg-ambient {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, rgba(59, 130, 246, 0.05) 40%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .container-404 {
      position: relative;
      z-index: 1;
      max-width: 620px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
    }
    .glitch-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 5rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #10B981, #3B82F6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .title-404 {
      font-size: 1.45rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .desc-404 {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .game-wrapper {
      background: #06080C;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 1rem;
      margin-bottom: 1.75rem;
      position: relative;
    }
    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
    }
    .game-header .score-box {
      color: var(--accent-emerald);
      font-weight: 700;
    }
    .game-header .high-box {
      color: var(--text-dim);
    }
    canvas {
      background: #0B0E14;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      display: block;
      margin: 0 auto;
      image-rendering: pixelated;
    }
    .game-controls-hint {
      margin-top: 0.75rem;
      font-size: 0.75rem;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }
    .btn-group {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.4rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: #FFFFFF;
      color: #000000;
    }
    .btn-primary:hover {
      background: #E2E8F0;
      transform: translateY(-1px);
    }
    .btn-outline {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
    }
    .btn-outline:hover {
      border-color: var(--border-strong);
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="bg-ambient"></div>

  <div class="container-404">
    <div class="glitch-code">404</div>
    <h1 class="title-404">Page Not Found</h1>
    <p class="desc-404">
      요청하신 페이지가 이동되었거나 존재하지 않습니다.<br>
      잠시 쉬어가는 시간으로 레트로 스네이크 게임을 즐겨보세요!
    </p>

    <!-- Snake Game Easter Egg -->
    <div class="game-wrapper">
      <div class="game-header">
        <div class="score-box">SCORE: <span id="currentScore">0</span></div>
        <div class="high-box">BEST: <span id="highScore">0</span></div>
      </div>
      <canvas id="snakeCanvas" width="360" height="240"></canvas>
      <div class="game-controls-hint">
        🎮 조작법: 방향키 (↑ ↓ ← →) 또는 W, A, S, D
      </div>
    </div>

    <div class="btn-group">
      <button onclick="restartGame()" class="btn btn-outline" id="restartBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        <span>게임 다시하기</span>
      </button>
      <a href="/" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        <span>홈으로 돌아가기</span>
      </a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('snakeCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('currentScore');
    const highEl = document.getElementById('highScore');

    const gridSize = 12;
    const tileCountX = canvas.width / gridSize;
    const tileCountY = canvas.height / gridSize;

    let snake = [{x: 10, y: 10}];
    let velocity = {x: 1, y: 0};
    let food = {x: 18, y: 10};
    let score = 0;
    let highScore = localStorage.getItem('dn_snake_best') || 0;
    highEl.innerText = highScore;

    let gameLoop = null;
    let isGameOver = false;

    function randomFood() {
      food = {
        x: Math.floor(Math.random() * tileCountX),
        y: Math.floor(Math.random() * tileCountY)
      };
      // Prevent food spawning on snake
      for (let s of snake) {
        if (s.x === food.x && s.y === food.y) return randomFood();
      }
    }

    function update() {
      if (isGameOver) return;

      const head = {x: snake[0].x + velocity.x, y: snake[0].y + velocity.y};

      // Wall collision wrap-around
      if (head.x < 0) head.x = tileCountX - 1;
      if (head.x >= tileCountX) head.x = 0;
      if (head.y < 0) head.y = tileCountY - 1;
      if (head.y >= tileCountY) head.y = 0;

      // Self collision
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          isGameOver = true;
          draw();
          return;
        }
      }

      snake.unshift(head);

      // Eat Food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.innerText = score;
        if (score > highScore) {
          highScore = score;
          highEl.innerText = highScore;
          localStorage.setItem('dn_snake_best', highScore);
        }
        randomFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#0B0E14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Grid Subtle
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Draw Food
      ctx.fillStyle = '#EF4444';
      ctx.shadowColor = '#EF4444';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 1, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Draw Snake
      snake.forEach((part, index) => {
        if (index === 0) {
          ctx.fillStyle = '#10B981';
          ctx.shadowColor = '#10B981';
          ctx.shadowBlur = 6;
        } else {
          ctx.fillStyle = '#059669';
          ctx.shadowBlur = 0;
        }
        ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
      });
      ctx.shadowBlur = 0;

      // Draw Game Over Overlay
      if (isGameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#F8FAFC';
        ctx.font = '700 18px "Plus Jakarta Sans", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 8);
        ctx.font = '500 12px "JetBrains Mono", monospace';
        ctx.fillStyle = '#94A3B8';
        ctx.fillText('Press Restart to Play Again', canvas.width / 2, canvas.height / 2 + 16);
      }
    }

    function restartGame() {
      snake = [{x: 10, y: 10}];
      velocity = {x: 1, y: 0};
      score = 0;
      scoreEl.innerText = '0';
      isGameOver = false;
      randomFood();
      if (!gameLoop) {
        gameLoop = setInterval(update, 90);
      }
    }

    window.addEventListener('keydown', function(e) {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) {
        e.preventDefault();
      }
      switch(e.code) {
        case 'ArrowUp':
        case 'KeyW':
          if (velocity.y === 0) velocity = {x: 0, y: -1};
          break;
        case 'ArrowDown':
        case 'KeyS':
          if (velocity.y === 0) velocity = {x: 0, y: 1};
          break;
        case 'ArrowLeft':
        case 'KeyA':
          if (velocity.x === 0) velocity = {x: -1, y: 0};
          break;
        case 'ArrowRight':
        case 'KeyD':
          if (velocity.x === 0) velocity = {x: 1, y: 0};
          break;
        case 'Space':
          if (isGameOver) restartGame();
          break;
      }
    });

    restartGame();
  </script>
</body>
</html>
